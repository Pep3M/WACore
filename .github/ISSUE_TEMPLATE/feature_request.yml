name: Feature request
description: Suggest an idea or a new endpoint
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your use case. What are you trying to build?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The endpoint, payload field or behavior you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
