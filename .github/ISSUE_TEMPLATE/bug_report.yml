name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **remove phone numbers, API keys and message contents** from anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start WACore with ...
        2. Call POST /api/send with ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WACore version
      placeholder: v1.6.0
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: How do you run it?
      options:
        - Docker image (ghcr.io/pep3m/wacore)
        - docker compose from this repo
        - From source with Bun
    validations:
      required: true
  - type: dropdown
    id: store
    attributes:
      label: Session store
      options: [file, redis, postgres]
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
