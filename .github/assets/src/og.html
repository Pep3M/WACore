<!doctype html>
<html class="dark">
<head>
<meta charset="utf-8">
<title>WACore OG</title>
<link rel="stylesheet" href="common.css">
<style>
  .canvas { width: 1280px; height: 640px; padding: 72px 76px; display: flex; flex-direction: column; }
  .top { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; }
  .wordmark { font-size: 44px; }
  .repo { font-family: 'JetBrains Mono', monospace; font-size: 20px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .repo svg { color: var(--text); }
  .main { position: relative; z-index: 1; margin-top: 58px; display: grid; grid-template-columns: 1fr 470px; gap: 40px; align-items: start; }
  h1 { font-size: 66px; line-height: 1.02; letter-spacing: -0.04em; font-weight: 800; }
  h1 em { font-style: normal; background: linear-gradient(90deg, var(--green-2), var(--green)); -webkit-background-clip: text; color: transparent; }
  p.sub { margin-top: 22px; font-size: 23px; line-height: 1.45; color: var(--muted); max-width: 600px; }
  .flows { display: flex; flex-direction: column; gap: 14px; margin-top: 6px; }
  .flow { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border: 1px solid var(--border-2); border-radius: 16px; background: color-mix(in srgb, var(--surface) 88%, transparent); }
  .flow .ic { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; flex: none; }
  .flow b { display: block; font-size: 19px; font-weight: 600; }
  .flow span { display: block; margin-top: 3px; font-family: 'JetBrains Mono', monospace; font-size: 14.5px; color: var(--muted); }
  .bottom { position: relative; z-index: 1; margin-top: auto; }
  .chips .chip { font-size: 16px; padding: 9px 16px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="top">
    <div class="brand"><img src="logo.svg" width="56" height="56" alt=""><div class="wordmark">WA<span>Core</span></div></div>
    <div class="repo">
      <svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      Pep3M/WACore
    </div>
  </div>
  <div class="main">
    <div>
      <h1>Self-hosted<br>WhatsApp API<br><em>for developers.</em></h1>
      <p class="sub">Scan a QR, get a REST API. Webhooks, SSE and polling included.</p>
    </div>
    <div class="flows">
      <div class="flow"><div class="ic" style="background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg></div><div><b>Send</b><span>POST /api/send · media · voice</span></div></div>
      <div class="flow"><div class="ic" style="background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg></div><div><b>Receive</b><span>webhook · SSE · polling</span></div></div>
      <div class="flow"><div class="ic" style="background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg></div><div><b>Stay online</b><span>auto-reconnect · Postgres · Redis</span></div></div>
    </div>
  </div>
  <div class="bottom chips">
    <span class="chip"><i></i>Bun 1.4</span>
    <span class="chip"><i style="background:var(--blue)"></i>TypeScript</span>
    <span class="chip"><i style="background:var(--amber)"></i>Docker ready</span>
    <span class="chip"><i style="background:var(--pink)"></i>MIT licensed</span>
  </div>
</div>
</body>
</html>
