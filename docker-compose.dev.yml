# ============================================================
# WACore - Entorno de desarrollo completo (back + front + infra)
# ============================================================
services:
  wacore:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wacore
    command: npx tsx watch src/index.ts
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./node_modules:/app/node_modules
    ports:
      - "9878:9878"
      - "9877:9877"
    environment:
      - WA_INSTANCE_NAME=bot-dev
      - HEALTH_PORT=9877
      - API_PORT=9878
      - LOG_LEVEL=debug
      - SESSION_STORE=postgres
      - DATABASE_URL=postgres://wacore:wacore@postgres:5432/wacore
      - CONNECT_ON_STARTUP=true
      - API_KEY=${API_KEY:-dev-api-key-123}
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  front:
    image: oven/bun:1.2
    container_name: wacore-front
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -c "bun install && bun run dev -- --host"
    environment:
      - VITE_API_KEY=${API_KEY:-dev-api-key-123}
      - VITE_API_URL=
      - VITE_PROXY_TARGET=http://wacore:9878
    ports:
      - "5175:5173"
    volumes:
      - ./front:/app
      - /app/node_modules
    depends_on:
      - wacore
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: wacore-postgres
    environment:
      POSTGRES_USER: wacore
      POSTGRES_PASSWORD: wacore
      POSTGRES_DB: wacore
    ports:
      - "5444:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wacore"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wacore-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
